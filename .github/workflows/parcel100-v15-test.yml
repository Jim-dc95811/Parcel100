name: Build and test Parcel100 1.5

on:
  push:
    branches: [ parcel100-v1.5-test ]

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parcel100-v1.5-test

      - name: Patch Parcel100 1.4 to 1.5
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          path = Path('Parcel100.py')
          text = path.read_text(encoding='utf-8')

          old_version = 'VERSION = "1.4"'
          assert old_version in text, 'Expected Parcel100 1.4 version marker not found'
          text = text.replace(old_version, 'VERSION = "1.5"', 1)

          read_start = text.index('def read_service(layer_url):')
          read_end = text.index('def _query_endpoint(layer_url):', read_start)
          new_read = dedent(r'''
          def _service_url_parts(url):
              clean = url.strip().rstrip("/")
              match = re.fullmatch(r"(.+/(?:FeatureServer|MapServer))(?:/(\d+))?", clean, re.IGNORECASE)
              if not match:
                  raise ValueError("Paste an ArcGIS FeatureServer or MapServer service or layer URL.")
              service_url = match.group(1)
              layer_id = int(match.group(2)) if match.group(2) is not None else None
              return service_url, layer_id


          def _read_polygon_layer(layer_url):
              layer_url = layer_url.rstrip("/")
              meta = _request(layer_url, {"f": "json"})
              if meta.get("type") not in ("Feature Layer", None):
                  raise ValueError("URL does not appear to be an ArcGIS feature layer.")
              if meta.get("geometryType") != "esriGeometryPolygon":
                  raise ValueError(f"Parcel100 requires a polygon layer. Service reports: {meta.get('geometryType')}")
              fields = meta.get("fields") or []
              if not fields:
                  raise ValueError("No fields were reported by the service.")
              return meta


          def discover_polygon_layers(url):
              service_url, layer_id = _service_url_parts(url)
              if layer_id is not None:
                  layer_url = f"{service_url}/{layer_id}"
                  return [(layer_url, _read_polygon_layer(layer_url))]

              service_meta = _request(service_url, {"f": "json"})
              layers = service_meta.get("layers") or []
              candidates = []
              for layer in layers:
                  candidate_id = layer.get("id")
                  if candidate_id is None:
                      continue
                  layer_url = f"{service_url}/{candidate_id}"
                  try:
                      meta = _request(layer_url, {"f": "json"})
                  except Exception:
                      continue
                  if meta.get("geometryType") != "esriGeometryPolygon":
                      continue
                  if not (meta.get("fields") or []):
                      continue
                  candidates.append((layer_url, meta))

              if not candidates:
                  raise ValueError("No polygon layers were found in this ArcGIS service.")
              return candidates


          ''').lstrip()
          text = text[:read_start] + new_read + text[read_end:]

          old_label = 'ttk.Label(outer, text="ArcGIS FeatureServer polygon layer URL", font=("Segoe UI", 10, "bold")).grid(row=3, column=0, sticky="w", pady=(12, 0))'
          new_label = 'ttk.Label(outer, text="ArcGIS FeatureServer / MapServer polygon service or layer URL", font=("Segoe UI", 10, "bold")).grid(row=3, column=0, sticky="w", pady=(12, 0))'
          assert old_label in text, 'Expected URL label not found'
          text = text.replace(old_label, new_label, 1)

          worker_start = text.index('    def _read_service_worker(self):')
          worker_end = text.index('    def _load_fields(self, meta, fields):', worker_start)
          worker_body = dedent(r'''
          def _read_service_worker(self):
              try:
                  candidates = discover_polygon_layers(self.url_var.get().strip())
                  self.after(0, self._handle_polygon_layers, candidates)
              except Exception as exc:
                  self.after(0, self._error, f"Could not read service:\n\n{exc}")

          def _handle_polygon_layers(self, candidates):
              if len(candidates) == 1:
                  layer_url, meta = candidates[0]
                  self._accept_polygon_layer(layer_url, meta)
                  return

              chooser = tk.Toplevel(self)
              chooser.title("Choose polygon layer")
              chooser.transient(self)

              ttk.Label(
                  chooser,
                  text="This service contains multiple polygon layers. Choose one:",
                  padding=(12, 12, 12, 6),
              ).pack(anchor="w")

              frame = ttk.Frame(chooser, padding=(12, 0, 12, 8))
              frame.pack(fill="both", expand=True)
              layer_list = tk.Listbox(frame, exportselection=False, height=min(12, len(candidates)), width=70)
              scroll = ttk.Scrollbar(frame, orient="vertical", command=layer_list.yview)
              layer_list.configure(yscrollcommand=scroll.set)
              layer_list.pack(side="left", fill="both", expand=True)
              scroll.pack(side="right", fill="y")

              for layer_url, meta in candidates:
                  layer_id = layer_url.rsplit("/", 1)[-1]
                  layer_list.insert(tk.END, f"{layer_id}: {meta.get('name', 'Layer')}")
              layer_list.selection_set(0)
              layer_list.see(0)

              buttons = ttk.Frame(chooser, padding=(12, 0, 12, 12))
              buttons.pack(fill="x")

              def use_selected(event=None):
                  selected = layer_list.curselection()
                  if not selected:
                      return
                  layer_url, meta = candidates[selected[0]]
                  try:
                      chooser.grab_release()
                  except tk.TclError:
                      pass
                  chooser.destroy()
                  self._accept_polygon_layer(layer_url, meta)

              def cancel():
                  try:
                      chooser.grab_release()
                  except tk.TclError:
                      pass
                  chooser.destroy()
                  self.set_busy(False)
                  self.status_var.set("Layer selection cancelled.")

              ttk.Button(buttons, text="Use Selected Layer", command=use_selected).pack(side="left")
              ttk.Button(buttons, text="Cancel", command=cancel).pack(side="right")
              layer_list.bind("<Double-Button-1>", use_selected)
              chooser.protocol("WM_DELETE_WINDOW", cancel)
              chooser.wait_visibility()
              chooser.grab_set()
              layer_list.focus_set()

          def _accept_polygon_layer(self, layer_url, meta):
              self.url_var.set(layer_url)
              fields = [f for f in meta.get("fields", []) if f.get("type") != "esriFieldTypeGeometry"]
              self._load_fields(meta, fields)

          ''').lstrip()
          new_worker = indent(worker_body, '    ')
          text = text[:worker_start] + new_worker + text[worker_end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile
        run: python3 -m py_compile Parcel100.py

      - name: Live service tests
        run: |
          python3 - <<'PY'
          import Parcel100

          root = 'https://services1.arcgis.com/ypdMhhEhrtBXLtQv/arcgis/rest/services/100800_Jacksonville_CWPP_Natural_Resources/FeatureServer'
          candidates = Parcel100.discover_polygon_layers(root)
          print('Discovered polygon layers:')
          for url, meta in candidates:
              print(url.rsplit('/', 1)[-1], meta.get('name'), meta.get('geometryType'))
          assert len(candidates) > 1
          assert all(meta.get('geometryType') == 'esriGeometryPolygon' for _, meta in candidates)

          direct = Parcel100.discover_polygon_layers(Parcel100.FLORIDA_URL)
          assert len(direct) == 1
          assert direct[0][0].endswith('/0')
          assert direct[0][1].get('geometryType') == 'esriGeometryPolygon'
          print('Explicit layer URL still works.')
          PY

      - name: GUI launch test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          xvfb-run -a python3 - <<'PY'
          import Parcel100
          app = Parcel100.Parcel100App()
          app.update_idletasks()
          app.update()
          print(app.title())
          assert app.title() == 'Parcel100 1.5'
          app.destroy()
          PY

      - name: Build test package
        run: zip -j Parcel100_v1.5.zip Parcel100.py Parcel100.bat

      - name: Commit tested build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Parcel100.py Parcel100_v1.5.zip
          git commit -m "Build Parcel100 1.5 service-root discovery"
          git push origin parcel100-v1.5-test
