<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#f7f9fb"/>
<text x="70" y="78" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#15354b">How Parcel100 Works</text>
<text x="70" y="122" font-family="Arial,sans-serif" font-size="22" fill="#526777">From one Master 4 box to manageable offline parcel intelligence.</text>
<g font-family="Arial,sans-serif">
  <g transform="translate(70,190)">
    <rect width="680" height="285" rx="24" fill="#fff" stroke="#2b6f95" stroke-width="4"/>
    <circle cx="65" cy="65" r="38" fill="#2b6f95"/><text x="65" y="78" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">1</text>
    <text x="125" y="62" font-size="30" font-weight="700" fill="#15354b">Enter Master 4</text>
    <text x="125" y="102" font-size="20" fill="#526777">West, east, south, north coordinates</text>
    <text x="125" y="132" font-size="20" fill="#526777">+ ArcGIS FeatureServer polygon-layer URL</text>
    <rect x="105" y="175" width="470" height="54" rx="8" fill="#eef4f8" stroke="#9fb6c5"/>
    <text x="125" y="210" font-size="21" fill="#15354b">82w,81w,30n,31n</text>
  </g>
  <g transform="translate(850,190)">
    <rect width="680" height="285" rx="24" fill="#fff" stroke="#2b6f95" stroke-width="4"/>
    <circle cx="65" cy="65" r="38" fill="#2b6f95"/><text x="65" y="78" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">2</text>
    <text x="125" y="62" font-size="30" font-weight="700" fill="#15354b">Choose Fields</text>
    <text x="125" y="102" font-size="20" fill="#526777">Keep only what is useful in the field:</text>
    <text x="125" y="148" font-size="20" fill="#15354b">✓ Owner name</text><text x="125" y="180" font-size="20" fill="#15354b">✓ Physical address</text><text x="125" y="212" font-size="20" fill="#15354b">✓ City / ZIP</text><text x="125" y="244" font-size="20" fill="#15354b">✓ Parcel ID</text>
  </g>
  <g transform="translate(70,565)">
    <rect width="680" height="285" rx="24" fill="#fff" stroke="#2b6f95" stroke-width="4"/>
    <circle cx="65" cy="65" r="38" fill="#2b6f95"/><text x="65" y="78" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">3</text>
    <text x="125" y="62" font-size="30" font-weight="700" fill="#15354b">Build up to 100 GeoJSONs</text>
    <text x="125" y="102" font-size="20" fill="#526777">The Master 4 becomes a deterministic 10 × 10 grid.</text>
    <text x="125" y="134" font-size="20" fill="#526777">Parcel100 queries each cell and skips empty cells.</text>
    <g transform="translate(150,160)" stroke="#2b6f95" fill="none" stroke-width="1.5">
      <rect width="140" height="90" stroke-width="3"/><path d="M28 0V90M56 0V90M84 0V90M112 0V90M0 18H140M0 36H140M0 54H140M0 72H140"/>
    </g>
    <text x="340" y="202" font-size="20" fill="#15354b">001 … 100</text><text x="340" y="236" font-size="20" fill="#526777">existing files preserved</text>
  </g>
  <g transform="translate(850,565)">
    <rect width="680" height="285" rx="24" fill="#fff" stroke="#2b6f95" stroke-width="4"/>
    <circle cx="65" cy="65" r="38" fill="#2b6f95"/><text x="65" y="78" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">4</text>
    <text x="125" y="62" font-size="30" font-weight="700" fill="#15354b">Open in ArcGIS Earth</text>
    <text x="125" y="102" font-size="20" fill="#526777">Load GeoJSON over the offline TPKX basemap.</text>
    <text x="125" y="136" font-size="20" fill="#526777">Click a parcel to inspect owner/address details.</text>
    <rect x="130" y="175" width="420" height="62" rx="10" fill="#e8f7f8" stroke="#199da9" stroke-width="3"/>
    <text x="150" y="202" font-size="18" fill="#15354b">OWN_NAME   Example Owner</text><text x="150" y="227" font-size="18" fill="#15354b">PHY_ADDR1  123 Example Rd</text>
  </g>
</g>
<g stroke="#2b6f95" stroke-width="5" fill="none"><path d="M770 332H825"/><path d="M800 492V540"/><path d="M770 707H825"/></g>
<g fill="#2b6f95"><polygon points="825,332 811,324 811,340"/><polygon points="800,540 792,526 808,526"/><polygon points="825,707 811,699 811,715"/></g>
<text x="70" y="930" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#15354b">Result: manageable offline parcel files instead of one giant statewide download.</text>
</svg>
